
services:
  mysql:
    image: mysql:8.0
    container_name: transaction-risk-mysql
    environment:
      MYSQL_DATABASE: transaction_risk_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: transaction-risk-engine
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/transaction_risk_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
    ports:
      - "8080:8080"

volumes:
  mysql_data:
